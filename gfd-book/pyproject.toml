[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gfdlib"
version = "0.1.0"
description = "Shared Pyodide-safe numeric primitives for the Interactive GFD textbook"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[tool.setuptools]
packages = ["gfdlib"]

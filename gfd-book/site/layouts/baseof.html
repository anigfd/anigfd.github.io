<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
<style>
  :root { --ink: #1a1a1a; --muted: #666; --accent: #145a86; --rule: #e2e2e2; }
  body { margin: 0; color: var(--ink); font: 17px/1.6 Georgia, 'Times New Roman', serif; }
  header.site { border-bottom: 1px solid var(--rule); font-family: system-ui, sans-serif; }
  header.site .inner, main, footer.site .inner { max-width: 46rem; margin: 0 auto; padding: 0.7rem 1.2rem; }
  header.site a { color: var(--accent); text-decoration: none; margin-right: 1rem; }
  main { padding: 1.5rem 1.2rem 3rem; }
  h1, h2, h3 { font-family: system-ui, sans-serif; line-height: 1.25; }
  a { color: var(--accent); }
  table { border-collapse: collapse; }
  th, td { border: 1px solid var(--rule); padding: 0.3rem 0.6rem; }
  code { font-size: 0.85em; background: #f5f5f5; padding: 0.1em 0.3em; border-radius: 3px; }
  .marimo-embed { margin: 1.5rem 0; }
  .marimo-embed button { font: 600 1rem system-ui, sans-serif; color: #fff; background: var(--accent);
    border: 0; border-radius: 8px; padding: 0.9rem 1.4rem; cursor: pointer; width: 100%; }
  .marimo-embed button small { display: block; font-weight: 400; opacity: 0.85; margin-top: 0.25rem; }
  .marimo-embed iframe { width: 100%; height: 920px; border: 1px solid var(--rule); border-radius: 8px; }
  footer.site { border-top: 1px solid var(--rule); color: var(--muted);
    font: 14px system-ui, sans-serif; margin-top: 2rem; }
</style>
</head>
<body>
<header class="site">
  <div class="inner">
    <a href="{{ site.Home.RelPermalink }}"><strong>{{ site.Title }}</strong></a>
    <a href="{{ "notation" | relURL }}/">Notation</a>
  </div>
</header>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer class="site">
  <div class="inner">A runnable companion to Vallis, Salmon &amp; Pedlosky ·
    notebooks execute in your browser via <a href="https://marimo.io">marimo</a> + Pyodide.</div>
</footer>
</body>
</html>

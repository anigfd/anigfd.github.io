name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: gfd-book

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: gfd-book/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gfdlib tests
        run: make test

      - name: Export every notebook to WASM (smoke check)
        run: make notebooks
